# Azure DevOps pipeline: build the TRS ASP.NET Core app and publish it to an
# EXISTING IIS site on server IS-VBOXX02.
#
# The "TRS" website, its "TRS" application pool (running under a custom domain
# identity), and the https binding (10.101.50.150:88 with an SSL certificate)
# already exist on the server and are managed by hand. This pipeline therefore
# does NOT create or reconfigure the site, app pool, identity, or bindings — it
# only pushes new app files into the existing site with Web Deploy (msdeploy).
#
# Stage 1 (Build) runs on a Microsoft-hosted Windows agent: it restores,
# builds, publishes the app and produces a Web Deploy (.zip) package saved as a
# pipeline artifact.
#
# Stage 2 (Deploy) runs on a Windows deployment group that contains the IIS
# server. It downloads the package and deploys it into the existing "TRS" site.
# The deployment-group agent must be installed on IS-VBOXX02 with the "IIS" tag.
#
# One-time setup on the IIS server:
#   * Install the ASP.NET Core 7 Hosting Bundle (if not already present).
#   * Install Web Deploy 3.6+ (required by the IIS Web App Deploy task).
#   * Register the machine in the Azure DevOps deployment group named below.
#
# Override the variables below (or set them in the pipeline UI / a variable
# group) to match your environment.

trigger:
  branches:
    include:
      - main
      - master

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '7.0.x'
  # Path to the project to publish.
  projectPath: 'TRS.csproj'
  # --- IIS deployment settings ---
  deploymentGroupName: 'iis-servers'
  # Name of the EXISTING IIS website to deploy into (as shown in IIS Manager).
  iisWebsiteName: 'TRS'

stages:
  - stage: Build
    displayName: 'Build & package'
    jobs:
      - job: Build
        displayName: 'Publish web deploy package'
        pool:
          vmImage: 'windows-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '$(projectPath)'

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(projectPath)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # Publish and zip the output so it can be pushed with Web Deploy.
          - task: DotNetCoreCLI@2
            displayName: 'Publish'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(projectPath)'
              arguments: '--configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/site'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish artifact: drop'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/site'
              ArtifactName: 'drop'

  - stage: Deploy
    displayName: 'Deploy to IIS'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployIIS
        displayName: 'Deploy to existing TRS site'
        environment:
          name: 'production'
          resourceType: VirtualMachine
        # Target the Windows deployment group machines that host IIS.
        pool:
          name: '$(deploymentGroupName)'
        strategy:
          runOnce:
            deploy:
              # A deployment job automatically downloads the current pipeline's
              # artifacts to $(Pipeline.Workspace)/<artifactName>, so no explicit
              # download task (and no task-version compatibility worries) needed.
              steps:
                # Deploy into the existing "TRS" site. No site/app-pool/binding
                # management here, so the custom app-pool identity, the
                # https:88 binding and the SSL certificate are left untouched.
                - task: IISWebAppDeploymentOnMachineGroup@0
                  displayName: 'Deploy package with Web Deploy'
                  inputs:
                    WebSiteName: '$(iisWebsiteName)'
                    Package: '$(Pipeline.Workspace)/drop/*.zip'
                    # Keep appsettings/other in-place config from being wiped;
                    # flip to true only if you want an exact mirror of the build.
                    RemoveAdditionalFilesFlag: false
                    # Stop the app during copy to avoid locked-DLL failures.
                    TakeAppOfflineFlag: true
